# Project profile. Everything about THIS repo that the stack-agnostic policy in
# change-classes.yaml needs. One per product repo. Humans own it (CODEOWNERS).
#
# Fail closed: a required gate with an empty command fails. An empty path set matches nothing.
# Globs use CODEOWNERS / gitignore syntax.

version: 1
project: SoftFactory2   # this repo holds the factory itself; no application code yet

# Layer 0 of the preplan. "Software in general" still means harnessable software: agents write
# no code in a repo until every line here is filled in (preplan Part 3, stage 0).
layer0:
  language: ""               # strictly typed: TypeScript strict, Go, Rust, or Python with pyright strict
  structural_lint: ""        # dependency-cruiser, ArchUnit, import-linter, or equivalent
  framework: ""              # one opinionated framework per layer, no bespoke plumbing
  formatter_linter: ""       # one formatter + linter with autofix; errors written as fix instructions
  unit_suite_max_minutes: 2
  scripts: []                # one script per repeated action, e.g. scripts/test-changed

paths:
  docs: ["docs/**", "**/*.md"]
  specs: ["specs/**"]
  tests: []
  dependency_manifests: []
  lockfiles: ["templates/**/package-lock.json"]
  generated: []                 # excluded from diff size. Listed here, not in .gitattributes, so agents cannot extend it.
  migrations: []
  infra: [".github/**"]
  sensor_config: ["scripts/**", ".yamllint.yml"] # add linter, type-checker and test-runner config when a stack is chosen
  flag_config: []
  security_sensitive: []
  factory: ["factory/**", "templates/**", "copier.yml", ".github/CODEOWNERS", "AGENTS.md", "CLAUDE.md", "skills/**"]

# Every path in specs, infra, sensor_config, flag_config, security_sensitive and factory must
# also have a code owner in .github/CODEOWNERS.

commands:              # one per gate of kind `check` in change-classes.yaml
  format: ""
  lint: ""
  typecheck: ""
  structural_lint: ""
  tests_changed: ""
  full_suite: ""
  mutation_changed: ""
  integration_twins: ""
  license_scan: ""
  vuln_scan: ""

thresholds:
  mutation_changed: 0.7         # guess, tune

# Holdout scenarios and the calibration set live outside this repo, where the Implementer's
# and Reviewer's sandboxes cannot read them. Record the location here once it exists.
holdout_scenarios: ""
calibration_set: ""

# Change-class policy. Humans own this file. Agents never edit it (CODEOWNERS).
#
# Autonomy levels:
#   L0  Agents do not author. Humans write; Reviewer agent may still report.
#   L1  Agent opens PR. Human reviews the report AND the diff, then merges.
#   L2  Agent opens PR. Human reviews the report; reads the diff only if a gate or the report raises a flag.
#   L3  Auto-merge when every gate passes. Covered by the weekly random audit.
#
# Classification: the Triage agent assigns a class from the issue. CI then re-derives it from
# the changed paths. If they disagree, or several classes match, the HIGHEST-RISK class wins.
# Order of risk, low to high, is the order of `classes` below.
#
# Everything starts at L1 or below. A class moves up one level only through a human PR to this
# file, citing the promotion evidence. (Staltz #13: premature automation is the root of all evil.)

version: 1
updated: 2026-11-11

defaults:
  max_diff_lines: 400          # added + removed, excluding generated files and lockfiles
  run_caps:
    max_tokens: 2000000
    max_wall_clock_minutes: 60
    max_retries: 2             # exceeding any cap fails the run; no graceful degradation
  required_gates: [format, lint, typecheck, tests_changed, full_suite, reviewer_report, merge_queue]
  approvers_required: 1        # humans; the requesting human and the authoring agent never count

promotion:
  # A class is eligible for +1 level when ALL hold over the window:
  window_merged_prs: 20
  max_reverts: 0
  max_incidents: 0
  min_first_pass_acceptance: 0.8   # merged without a human-requested change
  min_weeks_at_level: 2

demotion:
  # Any ONE of these drops the class one level immediately, until a human re-promotes it:
  triggers:
    - a merged PR in this class is reverted for a defect
    - a production incident is traced to a PR in this class
    - a weekly audit finds a BLOCK-level checklist miss
  error_budget:
    # Agent merges pause for ALL classes while either is exceeded in a rolling 7 days:
    max_reverts: 2
    max_incidents: 1

classes:
  - name: docs
    autonomy: L1               # target L3 once promoted
    paths: ["docs/**", "**/*.md", "!factory/**"]
    max_diff_lines: 600
    required_gates: [format, lint, reviewer_report]
    notes: Lowest risk. First class the Implementer works on (rollout weeks 3-4).

  - name: tests
    autonomy: L1
    paths: ["**/test/**", "**/tests/**", "**/*.test.*", "**/*_test.*"]
    rules:
      - may add tests; may not delete, skip, or loosen existing ones (checklist C2)
    required_gates: [format, lint, typecheck, tests_changed, full_suite, reviewer_report]

  - name: lint-fix
    autonomy: L1
    description: Mechanical fixes for lint or type errors with no behavior change.
    rules:
      - no change to public API signatures
      - no new rule disables or ignore comments (checklist G2)
    required_gates: [format, lint, typecheck, full_suite, reviewer_report, merge_queue]

  - name: deps-patch
    autonomy: L1
    description: Patch and minor upgrades of existing dependencies. Janitor-owned.
    paths: ["package.json", "**/lockfile*", "**/*.lock", "go.mod", "go.sum", "pyproject.toml"]
    rules:
      - no new packages (that is deps-new)
      - one dependency per PR
    required_gates: [lint, typecheck, full_suite, integration_twins, reviewer_report, merge_queue]

  - name: refactor
    autonomy: L1
    description: Behavior-preserving restructure, incl. dead-code removal.
    rules:
      - zero changes to existing test assertions
    required_gates: [format, lint, typecheck, structural_lint, full_suite, mutation_changed, reviewer_report, merge_queue]

  - name: feature
    autonomy: L1
    description: New or changed behavior from an approved spec.
    rules:
      - requires an approved spec with requirement IDs
      - every requirement ID has a fail-to-pass test
      - user-facing behavior ships behind a flag, default off
    required_gates: [format, lint, typecheck, structural_lint, tests_changed, fail_to_pass, mutation_changed, full_suite, integration_twins, verifier_verdict, reviewer_report, merge_queue]
    rollout: [flag_default_off, canary, auto_rollback]

  - name: deps-new
    autonomy: L1
    description: Adds a dependency.
    approvers_required: 1
    labels_required: [dep-approved]   # applied by a human only
    required_gates: [lint, typecheck, full_suite, license_scan, vuln_scan, reviewer_report, merge_queue]
    max_autonomy: L1

  - name: schema-migration
    autonomy: L1
    paths: ["**/migrations/**", "**/schema.*"]
    rules:
      - must include a down migration or state "one-way" in report section 5
    approvers_required: 2
    max_autonomy: L1

  - name: infra-ci
    autonomy: L0
    paths: [".github/**", "infra/**", "**/Dockerfile", "**/*.tf", "devcontainer.json", "flake.nix"]
    max_autonomy: L1
    notes: Agents may propose; a human always reads the diff.

  - name: security-sensitive
    autonomy: L0
    description: Auth, authz, payments, crypto, secrets handling, PII.
    paths: ["**/auth/**", "**/payments/**", "**/crypto/**"]   # replace with your real paths
    approvers_required: 2
    max_autonomy: L1

  - name: factory
    autonomy: L0
    paths: ["factory/**", "CODEOWNERS", ".github/CODEOWNERS", "AGENTS.md", "CLAUDE.md", "skills/**"]
    max_autonomy: L1
    notes: Only the weekly Harness Improver agent may propose here. A human always merges.

# Change log: date, class, old -> new level, evidence link.
history: []

# Tests the web-nextjs template the way a product repo would: its own scripts/ci, every gate.
name: template-web-nextjs

on:
  pull_request:
    paths: ["templates/web-nextjs/**", "factory/**", "copier.yml", "scripts/render-check", ".github/workflows/template-web-nextjs.yml"]
  push:
    branches: [main]
    paths: ["templates/web-nextjs/**", "factory/**", "copier.yml", "scripts/render-check", ".github/workflows/template-web-nextjs.yml"]

permissions:
  contents: read

concurrency:
  group: template-web-nextjs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: templates/web-nextjs
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres # throwaway container, reachable only inside this job
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/app_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changed-scope gates compare against the base branch
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: templates/web-nextjs/.node-version
          cache: npm
          cache-dependency-path: templates/web-nextjs/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Every gate, in order
        run: scripts/ci ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: templates/web-nextjs/reports/screenshots
          if-no-files-found: ignore

  render:
    # Creates a product with Copier, the way a real product starts, and runs its fast gates.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: templates/web-nextjs/.node-version
      - run: pipx install copier==9.19.1
      - run: scripts/render-check web-nextjs
